[package]
name = "staticlib"
version = "0.1.0"
edition = "2021"

[dependencies]
spin = "0.9.8"
tweed = {path = "../../tweed", default-features = false, features = ["custom_page_size", "call-threading"]}

[lib]
name = "tweed_staticlib"
crate-type = ["staticlib"]

