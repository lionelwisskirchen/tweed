stages:
  - style
  - format
  - test
  - benchmark

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always # The pipeline cares about MR updates
    - if: '$CI_COMMIT_TAG =~ /^v\d+.\d+.\d+$/'
      when: always # The pipeline should run for tagged releases
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: never # The pipeline does not care about non-MR-related pushes
    - when: always # The pipeline cares about everything else

default:
  tags:
    - pi-runner

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_UPDATE_FLAGS: --remote
  GIT_DEPTH: 1
  GIT_STRATEGY: clone

style-test-job:
  stage: style
  script: nix develop # --command bash -c './scripts/style-checks.bash'

format-test-job:
  stage: format
  script: nix develop --command bash -c './scripts/format-checks.bash'

unit-test-job:
  stage: test
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: tweed/target/llvm-cov-target/cobertura.xml
  # this uses region for coverage summary
  coverage: '/TOTAL\s+(\d+\s+)+(\d+\.\d+\%)/'
  script: nix develop --command bash -c './scripts/coverage-checks.bash'

benchmark-job:
  stage: benchmark
  when: manual
  script:
    - cd benchmarks
    - nix develop --command bash -c 'openocd -f openocd.cfg > openocd.log 2>&1 &' 
    - OPENOCD_PID=$(pidof openocd)
    - trap 'kill $OPENOCD_PID 2>/dev/null || true' EXIT     

    - echo "Start Benchmarking"
    - cd ./stm32/l4
    - nix develop --command bash -c '
      python ../run-benches.py
      --outname $CI_COMMIT_SHA
      ../../benchmark_sources/huffbench.wasm 
      results'
    - echo "Finished Benchmarking"      
  artifacts:
    paths:
      - benchmarks/stm32/l4/results/$CI_COMMIT_SHA.csv
      
push-results-job:
  stage: benchmark
  when: manual
  needs:
    - job: benchmark-job
  script:
    - git config user.name "GitLab CI"
    - git config user.email "gitlab-ci@example.com"
    - git clone "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.lrz.de/aemy/tweed/tweed-benchmarking-data.git"
    - cd tweed-benchmarking-data
    - cp ../benchmarks/stm32/l4/results/$CI_COMMIT_SHA.csv ./
    - git add $CI_COMMIT_SHA.csv
    - git commit -m "Update generated files"
    - git push origin main
