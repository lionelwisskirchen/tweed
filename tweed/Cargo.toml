[package]
name = "tweed"
version = "0.1.0"
edition = "2021"


[dependencies]
libm = "0.2.15"
log = {version = "0.4.27", default-features = false }

[dev-dependencies]
wat = "1.219.1"
wast = "251.0.0"
rstest = "0.22.0"
criterion = { version = "0.4.0", features = ["html_reports"] }
test-log = "0.2.17"

[[bench]]
name = "interpreter"
harness = false

[profile.profiling]
inherits = "release"
debug = true

[features]
default = ["std"]
std = []
unsafe = []
custom_page_size = []
tail-call = []
match-tail-call = []
call-threading = []

[[test]]
name = "custom_page_size_tests"
path = "tests/proposals/custom_page_size_tests.rs"
required-features = ["custom_page_size"]


[[test]]
name = "spec_tests"
path = "tests/spec/spec_tests.rs"
