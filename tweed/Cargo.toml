[package]
name = "tweed"
version = "0.1.0"
edition = "2021"


[dependencies]
log = {version = "0.4.27", default-features = false }
 
[dev-dependencies]  
wat = "1.219.1"
wast = "221.0.2"
rstest = "0.22.0"
criterion = { version = "0.4.0", features = ["html_reports"] }

[[bench]]
name = "interpreter"
harness = false
 
[profile.profiling]
inherits = "release"
debug = true

[features]
default = ["std"]
std = []
 